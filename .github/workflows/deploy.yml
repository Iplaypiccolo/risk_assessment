# GitHub Pages 배포
# 카카오 JavaScript 키: js/config.js 에 있는 값을 쓰고, GitHub Secrets(KAKAO_JS_KEY)가 있으면 그 값으로 바꿉니다.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 카카오 키 (Secrets가 있으면 사용)
        env:
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
        run: |
          node -e "
            const fs = require('fs');
            const key = (process.env.KAKAO_JS_KEY || '').trim();
            if (key) { fs.writeFileSync('js/config.js', 'window.APP_CONFIG = ' + JSON.stringify({ kakaoJsKey: key }) + ';\n'); console.log('Secrets 의 카카오 키 사용'); }
            else console.log('js/config.js 의 카카오 키 그대로 사용');
          "
          rm -rf .github

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

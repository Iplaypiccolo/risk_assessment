<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<meta name="color-scheme" content="light">
<title>위험성평가 보고서 만들기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="inapp" class="inapp" hidden></div>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg></span>
      <div class="top-title" id="topTitle">위험성평가 보고서 만들기</div>
    </div>
    <button class="top-home" data-act="home" aria-label="처음 화면"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg></button>
    <button class="top-menu" data-act="menu" id="topMenu" hidden aria-label="단계 목록"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div class="progress" id="progress" hidden><div class="progress-bar" id="progressBar"></div></div>
</header>
<main id="app" class="app"></main>
<nav class="bottom" id="bottomNav" hidden>
  <button class="btn btn-ghost" data-act="prev" id="btnPrev">◀ 이전</button>
  <button class="btn btn-primary" data-act="next" id="btnNext">다음 ▶</button>
</nav>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/template.js"></script>
<script src="js/logic.js"></script>
<script src="js/store.js"></script>
<script src="js/photo.js"></script>
<script src="js/near.js"></script>
<script src="js/pdf.js"></script>
<script src="js/app.js"></script>
</body>
</html>

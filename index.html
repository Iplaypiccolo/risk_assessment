<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="color-scheme" content="light">
<title>위험성평가 보고서 만들기</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="inapp" class="inapp" hidden></div>
<header class="top">
  <div class="top-inner">
    <button class="top-home" data-act="home" aria-label="처음 화면">⌂</button>
    <div class="top-title" id="topTitle">위험성평가 보고서 만들기</div>
    <button class="top-menu" data-act="menu" id="topMenu" hidden>목록</button>
  </div>
  <div class="progress" id="progress" hidden><div class="progress-bar" id="progressBar"></div></div>
</header>
<main id="app" class="app"></main>
<nav class="bottom" id="bottomNav" hidden>
  <button class="btn btn-ghost" data-act="prev" id="btnPrev">◀ 이전</button>
  <button class="btn btn-primary" data-act="next" id="btnNext">다음 ▶</button>
</nav>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/template.js"></script>
<script src="js/logic.js"></script>
<script src="js/store.js"></script>
<script src="js/photo.js"></script>
<script src="js/near.js"></script>
<script src="js/pdf.js"></script>
<script src="js/app.js"></script>
</body>
</html>
